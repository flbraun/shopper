# glibc address selection (RFC 6724 defaults) with one change: unique local
# IPv6 addresses (fc00::/7, used by Docker's IPv6 networks) share the label
# of global IPv6. Otherwise glibc prefers IPv4 for global destinations, and
# dl.google.com is unreachable over IPv4 on some networks.
label ::1/128 0
label ::/0 1
label 2002::/16 2
label ::/96 3
label ::ffff:0:0/96 4
label fec0::/10 5
label fc00::/7 1
label 2001:0::/32 7
precedence ::1/128 50
precedence ::/0 40
precedence fc00::/7 40
precedence 2002::/16 30
precedence ::/96 20
precedence ::ffff:0:0/96 10
