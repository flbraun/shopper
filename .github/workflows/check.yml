name: Check

# Code style (formatter, linter, generated translations) and tests on every
# push to a branch and on pull requests. Tag pushes are handled by
# release.yml, which runs the same checks itself.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check generated translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Lint
        run: flutter analyze

      - name: Test
        run: flutter test
